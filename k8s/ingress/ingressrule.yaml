apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: oneingress
  namespace: med-erp
spec:
  ingressClassName: nginx
  rules:
  - host: a1784cf0b131b40aaae6aed290a60b86-1510058186.ap-south-1.elb.amazonaws.com
    http:
      paths:
      - path: /api/v1/auth
        pathType: Prefix
        backend:
          service:
            name: user-service
            port:
              number: 8081

      - path: /api/v1/users
        pathType: Prefix
        backend:
          service:
            name: user-service
            port:
              number: 8081

      - path: /api/v1/products
        pathType: Prefix
        backend:
          service:
            name: product-service
            port:
              number: 8082

      - path: /api/v1/orders
        pathType: Prefix
        backend:
          service:
            name: order-service
            port:
              number: 8083