apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: oneingress
  namespace: med-erp
spec:
  ingressClassName: nginx
  rules:
  - host: a9eee1c148a0544a0b4118e7f8d01fc7-920696369.us-east-2.elb.amazonaws.com
    http:
      paths:
      - path: /api/v1/auth
        pathType: Prefix
        backend:
          service:
            name: user-service
            port:
              number: 8081

      - path: /api/v1/users
        pathType: Prefix
        backend:
          service:
            name: user-service
            port:
              number: 8081

      - path: /api/v1/products
        pathType: Prefix
        backend:
          service:
            name: product-service
            port:
              number: 8082

      - path: /api/v1/orders
        pathType: Prefix
        backend:
          service:
            name: order-service
            port:
              number: 8083